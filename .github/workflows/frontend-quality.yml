name: frontend-quality

on:
  pull_request:
  push:
    branches: [main, master, Asif]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontend design contract
        run: python -m orchestrator.cli frontend-check --area all

  browser:
    runs-on: ubuntu-24.04
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inference/requirements-esg.txt
      - run: pip install -r inference/requirements-esg.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - name: Protected browser journeys (10 viewport projects)
        env:
          ESG_PYTHON: python
        run: npx playwright test --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-report
          path: |
            docs/qa/playwright-report/
            test-results/
          retention-days: 7
