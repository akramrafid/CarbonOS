name: esg-ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: esg
          POSTGRES_PASSWORD: esg
          POSTGRES_DB: esg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U esg" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inference/requirements-esg.txt
      - run: pip install -r inference/requirements-esg.txt
      - name: Local OCR (Tesseract with the Bengali and English models) and fonts for the OCR smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ben fonts-noto-core fonts-dejavu-core
      - name: Orchestrator tests
        run: python -m unittest tests.test_orchestrator
      - name: ESG tests (SQLite)
        run: python -m unittest discover -s tests -p "test_esg*.py" -v
      - name: OCR smoke test (fails instead of skipping when Tesseract ben+eng is missing)
        env:
          ESG_REQUIRE_OCR: "1"
        run: python -m unittest tests.test_esg_ocr_smoke -v
      - name: Grid factor derivation (synthetic inputs)
        run: python -m unittest tests.test_bd_grid -v
      - name: ESG tests (PostgreSQL + Alembic migrations)
        env:
          ESG_TEST_DATABASE_URL: postgresql+psycopg2://esg:esg@localhost:5432/esg_test
        run: python -m unittest discover -s tests -p "test_esg*.py" -v
      - name: Migrations match models
        working-directory: inference
        run: |
          python -c "
          from alembic import command
          from esg_rag.database import alembic_config
          command.check(alembic_config('postgresql+psycopg2://esg:esg@localhost:5432/esg_test'))"

  mutation:
    # Mutation testing of inference/esg_rag/accounting.py (acceptance A4). mutmut needs fork(), so it runs on Linux.
    # Score = (killed + timeout) / (total - skipped); the job fails below 80 %.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inference/requirements-esg.txt
      - run: pip install -r inference/requirements-esg.txt mutmut==3.8.0
      - name: Workspace with the source under src/ (a mutant's module path must equal the path the tests import)
        run: |
          mkdir -p "$RUNNER_TEMP/mutation"
          cp -r inference "$RUNNER_TEMP/mutation/src"
          cp -r tests "$RUNNER_TEMP/mutation/tests"
          cp tests/mutation/pyproject.toml "$RUNNER_TEMP/mutation/pyproject.toml"
      - name: mutmut run
        working-directory: ${{ runner.temp }}/mutation
        env:
          HYPOTHESIS_PROFILE: mutation
        run: |
          mutmut run
          mutmut export-cicd-stats
      - name: Mutation score of accounting.py >= 80 %
        working-directory: ${{ runner.temp }}/mutation
        run: python tests/mutation/score.py mutants/mutmut-cicd-stats.json --minimum 80
      - name: List the mutants that were not killed
        if: always()
        working-directory: ${{ runner.temp }}/mutation
        run: mutmut results > mutants/not-killed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-results
          path: |
            ${{ runner.temp }}/mutation/mutants/mutmut-cicd-stats.json
            ${{ runner.temp }}/mutation/mutants/not-killed.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inference/requirements-esg.txt
      - run: pip install -r inference/requirements-esg.txt
      - run: npx playwright install --with-deps chromium
      - name: E2E (SPA + standalone ESG API, 4 viewports)
        env:
          ESG_PYTHON: python
        run: npx playwright test
