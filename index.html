<!doctype html>

    <!-- Inline Theme Initializer (Anti-FOUC, supports light / dark / system) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('carbonos-theme') || localStorage.getItem('theme');
          var mode = (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (sysDark ? 'dark' : 'light') : mode;
          var root = document.documentElement;
          root.setAttribute('data-theme', resolved);
          root.setAttribute('data-theme-mode', mode);
          root.style.colorScheme = resolved;
          if (resolved === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
        } catch (e) {
          var fallbackDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var fallback = fallbackDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', fallback);
          document.documentElement.setAttribute('data-theme-mode', 'system');
          document.documentElement.style.colorScheme = fallback;
          document.documentElement.classList.toggle('dark', fallback === 'dark');
          document.documentElement.classList.toggle('light', fallback !== 'dark');
        }
      })();
    </script>
