# D1, SYNTHETIC test fixtures, data only:
#  1. version 2 of the existing synthetic-grid-ht profile: the new demand.kva.max field and a new rule;
#  2. a new utility, "SYNTHETIC RIVER POWER", whose (invented) bill is printed in Bengali with Bengali digits.
# Neither is a real utility or layout.
schema: carbonos.bill_profile/1
profiles:
  - profile_key: synthetic-grid-ht
    issuer: SYNTHETIC GRID CO (test fixture, not a real utility)
    document_type: electricity_ht
    layout_version: synthetic-2
    languages: [en]
    effective_from: 2025-01-01
    detect:
      all_of: ["SYNTHETIC GRID CO"]
    sections:
      meter: {repeat_anchor: ["Meter No"]}
    fields:
      - {key: account.number, required: true, hints: [{anchor: ["Account No"], take: value}]}
      - {key: bill.number, hints: [{anchor: ["Bill No"], take: value}]}
      - {key: period.start, required: true, hints: [{anchor: ["Period From"]}]}
      - {key: period.end, required: true, hints: [{anchor: ["Period To"]}]}
      - {key: energy.kwh.total, required: true, unit: kWh, hints: [{anchor: ["Total Energy"]}]}
      - {key: cost.total, unit: BDT, hints: [{anchor: ["Amount Payable"]}]}
      - {key: meter.serial, required: true, hints: [{anchor: ["Meter No"], take: value}]}
      - {key: meter.multiplier, required: true, hints: [{anchor: ["MF"]}]}
      - {key: demand.kw.max, hints: [{anchor: ["Max Demand"]}]}
      - {key: demand.kva.max, hints: [{anchor: ["Max kVA"]}]}
    tables:
      - group: register
        required: true
        header: ["Register", "Previous", "Present", "kWh"]
        label: {key: register.band, values: {off_peak: ["Off-Peak"], peak: ["Peak"], flat: ["Flat"]}}
        columns: [meter.read.previous, meter.read.current, energy.kwh.register]
        flags: {meter.read.estimated: ["(E)"]}
    rulesets: [period, electricity_meter_reads]
    rules:
      - code: DEMAND_KVA_BELOW_KW
        scope: meter
        expect: "demand.kva.max >= demand.kw.max"
        message: "Maximum apparent demand {demand.kva.max} kVA is below the real-power demand {demand.kw.max} kW"

  - profile_key: synthetic-river-power-lt
    issuer: SYNTHETIC RIVER POWER (test fixture, not a real utility)
    document_type: electricity_lt
    layout_version: synthetic-1
    languages: [bn, en]
    effective_from: 2025-01-01
    detect:
      all_of: ["সিনথেটিক রিভার পাওয়ার"]
    fields:
      - {key: account.number, required: true, hints: [{anchor: ["হিসাব নং"], take: value}]}
      - {key: period.start, required: true, hints: [{anchor: ["মেয়াদ শুরু"]}]}
      - {key: period.end, required: true, hints: [{anchor: ["মেয়াদ শেষ"]}]}
      - {key: meter.serial, required: true, hints: [{anchor: ["মিটার নং"], take: value}]}
      - {key: meter.multiplier, hints: [{anchor: ["গুণক"]}]}
      - {key: energy.kwh.total, required: true, unit: kWh, hints: [{anchor: ["মোট ইউনিট"]}]}
      - {key: cost.total, unit: BDT, hints: [{anchor: ["মোট টাকা"]}]}
    rulesets: [period]
